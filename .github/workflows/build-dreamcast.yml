name: build-dreamcast
# One Dreamcast disc per run: bore2_dc.gdi (plus the .elf). Run it by hand (Actions > build-dreamcast > Run workflow)
# or it runs on every push that touches the Dreamcast port or the game's own sources.
on:
  workflow_dispatch:
  push:
    paths: ["ports/dreamcast/**", "src/**", ".github/workflows/build-dreamcast.yml"]
jobs:
  disc:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Tools
        run: sudo apt-get update && sudo apt-get install -y python3 python3-pil xz-utils make libpng-dev libegl1 libgl1-mesa-dri
      - name: Get the saved Dreamcast toolchain (branch dc-toolchain)
        run: ports/dreamcast/toolchain/restore.sh
      - name: Build the disc
        run: |
          source /tmp/dc/environ.sh
          cd ports/dreamcast && make disc
      - name: Capture native Dreamcast title in Flycast
        timeout-minutes: 12
        run: |
          source /tmp/dc/environ.sh
          bash test/dc_title_visual.sh "$PWD/out-dc-title"
      - name: Upload native Dreamcast title regression evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bore2_dc_title_native
          path: |
            out-dc-title/title_*.ppm
            out-dc-title/title_results.json
            out-dc-title/emulate.log
            out-dc-title/symbols.txt
          if-no-files-found: warn
      - name: Install the native PS1 compiler for independent cross-port compatibility
        run: |
          sudo apt-get install -y cmake ninja-build unzip
          BASE=https://github.com/Lameguy64/PSn00bSDK/releases/download/v0.24
          curl -fsSL "$BASE/gcc-mipsel-none-elf-12.3.0-Linux.zip" -o gcc-ps1.zip
          curl -fsSL "$BASE/PSn00bSDK-0.24-Linux.zip" -o sdk-ps1.zip
          sudo unzip -q sdk-ps1.zip -d /opt
          sudo mv /opt/PSn00bSDK-0.24-Linux /opt/psn00bsdk
          sudo unzip -q gcc-ps1.zip -d /opt/psn00bsdk
          sudo chmod -R a+rx /opt/psn00bsdk
      - name: Verify the native PS1 target still builds after Dreamcast changes
        run: bash ports/dreamcast/ps1_check.sh "$PWD" "$PWD/out-ps1-dc-compat"
      - name: Upload PS1 cross-port compatibility evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bore2_dc_ps1_crosscheck
          path: |
            out-ps1-dc-compat/config.log
            out-ps1-dc-compat/build.log
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        with:
          name: bore2_dc_disc
          path: |
            ports/dreamcast/obj/bore2_dc.gdi
            ports/dreamcast/obj/*.bin
            ports/dreamcast/obj/*.raw
            ports/dreamcast/obj/bore2_dc.elf
