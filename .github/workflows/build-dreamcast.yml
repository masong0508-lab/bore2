name: build-dreamcast
# One Dreamcast disc per run: bore2_dc.gdi (plus the .elf). Run it by hand (Actions > build-dreamcast > Run workflow)
# or it runs on every push that touches the Dreamcast port or the game's own sources.
on:
  workflow_dispatch:
  push:
    paths: ["ports/dreamcast/**", "src/**", "tools/neighborhood_music.py", "tools/living_score.py", "tools/content_spu.c", "tools/dsmusic/**", "assets/SONGS.BIN", "assets/songs.inc", "assets/dsmusic.bin", ".github/workflows/build-dreamcast.yml"]
jobs:
  disc:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Verify contextual resident dialogue and bounded activity poses
        run: cc -std=c99 -Wall -Wextra -Werror -DBORE_DC -Isrc test/native_life_test.c -o /tmp/native_life && /tmp/native_life
      - name: Verify frame ownership and safe cache replacement
        run: cc -std=c99 -Wall -Wextra -Werror -Isrc test/frame_render_policy_test.c -o /tmp/frame_policy && /tmp/frame_policy
      - name: Tools
        run: sudo apt-get update && sudo apt-get install -y python3 xz-utils make libpng-dev
      - name: Get the saved Dreamcast toolchain (branch dc-toolchain)
        run: ports/dreamcast/toolchain/restore.sh
      - name: Build the disc
        run: |
          source /tmp/dc/environ.sh
          cd ports/dreamcast && make disc
      - name: Check that the PS1 image is unchanged
        continue-on-error: true
        run: ports/dreamcast/ps1_check.sh
      - uses: actions/upload-artifact@v4
        with:
          name: bore2_dc_disc
          path: |
            ports/dreamcast/obj/bore2_dc.gdi
            ports/dreamcast/obj/*.bin
            ports/dreamcast/obj/*.raw
            ports/dreamcast/obj/bore2_dc.elf
