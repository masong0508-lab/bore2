name: ps1-camera-visual-qa
# One close-home angle sampled three times, with matched final frozen state.
on:
  workflow_dispatch:
  push:
    paths:
      - "src/main.c"
      - "src/gfx.c"
      - "src/gfx.h"
      - "src/world.c"
      - "src/bigmap.h"
      - "src/far.c"
      - "src/voxel.c"
      - "src/render_cache_compact.h"
      - "src/far_land_cache.h"
      - "src/world_surface.h"
      - "test/far_land_cache_test.c"
      - "test/render_cache_compact_test.c"
      - "src/crowd.c"
      - "src/citizens.c"
      - "src/camera_lens.h"
      - "test/camera_lens_test.c"
      - "test/ps1_camera_visual.sh"
      - "test/ps1_house_motion_visual.sh"
      - "test/ps1_frame_flash.py"
      - "src/frame_render_policy.h"
      - "src/gfx_fast.h"
      - "src/far.h"
      - "src/world_stream_models.h"
      - "src/house_lod.h"
      - "src/house_footprint.h"
      - ".github/workflows/ps1-camera-visual-qa.yml"
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && !startsWith(github.ref, 'refs/heads/improve/coherent-world-release-pass-') }}
jobs:
  ps1-camera:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Host camera tests (old, corrected, Dreamcast)
        run: |
          set -e
          for setting in "" "-DBORE_LENS_LEGACY=1" "-DBORE_DC=1"; do
            cc -std=c99 -Wall -Wextra -Werror $setting test/camera_lens_test.c -o /tmp/camera_math
            /tmp/camera_math
          done
      - name: Restore legal PS1 compiler and headless emulator with OpenBIOS
        run: |
          sudo apt-get update
          sudo apt-get install -y libcurl4t64 ninja-build cmake xz-utils unzip python3-pil
          sudo mkdir -p /home/claude/tools /opt/psn00bsdk
          sudo chown -R "${USER}:${USER}" /home/claude/tools /opt/psn00bsdk
          # restore.sh atomically replaces /opt/psn00bsdk, so the ephemeral
          # runner needs write access to its parent during extraction.
          sudo chown "${USER}:${USER}" /opt
          bash tools/perf/restore.sh
      - name: Capture native PS1 close-home lens comparison
        timeout-minutes: 30
        run: bash test/ps1_camera_visual.sh "$PWD/out-ps1-camera"
      - name: Preserve lens comparison screenshots and emulator evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bore2_ps1_camera_native_ab
          path: |
            out-ps1-camera/comparison_*.png
            out-ps1-camera/camera_visual_results.json
            out-ps1-camera/shots-legacy/**/*.png
            out-ps1-camera/shots-corrected/**/*.png
            out-ps1-camera/emulate-*.log
            out-ps1-camera/build-*.log
            out-ps1-camera/config-*.log
            out-ps1-camera/final_state-*.json
            out-ps1-camera/ram-*.bin
            out-ps1-camera/symbols-*.txt
            out-ps1-camera/script-*.txt
          if-no-files-found: warn

      - name: Capture real PS1 house geometry through moving orbit and dolly
        timeout-minutes: 20
        run: bash test/ps1_house_motion_visual.sh "$PWD/out-ps1-house-motion"
      - name: Upload native moving-house screenshots and results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bore2_ps1_house_motion_native
          path: |
            out-ps1-house-motion/house_*.png
            out-ps1-house-motion/shots/**/*.png
            out-ps1-house-motion/house_motion_results.json
            out-ps1-house-motion/ram.bin
            out-ps1-house-motion/symbols.txt
            out-ps1-house-motion/route.txt
            out-ps1-house-motion/config.log
            out-ps1-house-motion/build.log
            out-ps1-house-motion/emulate.log
          if-no-files-found: warn
