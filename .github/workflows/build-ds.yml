name: build-ds
# One DS/DSi ROM per run: bore2_dsi.nds. Run it by hand (Actions > build-ds > Run workflow) or it runs on every push
# that touches the DS port or the shared game files.
on:
  workflow_dispatch:
  push:
    paths: ["ports/dsi/**", "tools/dsbuild/**", "tools/dsemu/**", "src/bigmap.*", "src/common.h", "assets/dsmusic.bin", ".github/workflows/build-ds.yml"]
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
jobs:
  rom:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Test DS neighborhood viewport (host C99)
        run: cc -std=c99 -Wall -Wextra -Werror ports/dsi/test/ds_mapview_test.c -o /tmp/ds_mapview_test && /tmp/ds_mapview_test
      - name: Test DS floor and roof geometry
        run: cc -std=c99 -Wall -Wextra -Werror ports/dsi/test/ds_render_geom_test.c -o /tmp/ds_render_geom_test && /tmp/ds_render_geom_test
      - name: Test handheld and console aspiration regressions
        run: python3 test/wants_regression.py
      - name: Verify DS persistent contacts and collision handling
        run: cc -std=c99 -Wall -Wextra -Werror ports/dsi/test/ds_contacts_test.c -o /tmp/ds_contacts_test && /tmp/ds_contacts_test
      - name: Verify stable resident routines and streaming fringe
        run: cc -std=c99 -Wall -Wextra -Werror ports/dsi/test/ds_cit_routine_test.c -o /tmp/ds_cit_routine_test && /tmp/ds_cit_routine_test
      - name: Test DS safe deletion confirmation
        run: cc -std=c99 -Wall -Wextra -Werror ports/dsi/test/ds_confirm_test.c -o /tmp/ds_confirm_test && /tmp/ds_confirm_test
      - name: Test DS furniture reachability and boundary walls
        run: cc -std=c99 -Wall -Wextra -Werror ports/dsi/test/ds_action_spots_test.c -o /tmp/ds_action_spots_test && /tmp/ds_action_spots_test
      - name: Tools (clang, lld, python)
        run: sudo apt-get update && sudo apt-get install -y clang-18 lld-18 llvm-18 python3 xz-utils && sudo ln -sf /usr/bin/ld.lld-18 /usr/local/bin/ld.lld && sudo ln -sf /usr/bin/llvm-objcopy-18 /usr/local/bin/llvm-objcopy && sudo ln -sf /usr/bin/clang-18 /usr/local/bin/clang
      - name: Get the saved DS toolchain (branch ds-toolchain)
        run: tools/dsbuild/restore.sh
      - name: Build the ROM
        run: OUT=$PWD/out tools/dsbuild/mkp.sh
      - name: Emulate purchase, save/load and job gameplay
        timeout-minutes: 8
        run: |
          test -x /tmp/dsrun
          test -f out/bore.elf
          sudo ln -sf /usr/bin/llvm-nm-18 /usr/local/bin/llvm-nm
          DSRUN=/tmp/dsrun bash ports/dsi/test/ds_flow.sh "$PWD/out"
      - name: Emulate safe title-screen save deletion
        timeout-minutes: 6
        run: DSRUN=/tmp/dsrun bash ports/dsi/test/ds_delete_smoke.sh "$PWD/out"
      - name: Emulate stairs and island interaction suite
        timeout-minutes: 8
        run: |
          OUT="$PWD/out-island" XTRA="-DDSTEST -DDS_ISL_TEST" bash tools/dsbuild/mkp.sh
          DSRUN=/tmp/dsrun bash ports/dsi/test/ds_island_smoke.sh "$PWD/out-island"
      - name: Emulate furnished-home interaction routes
        timeout-minutes: 8
        run: |
          OUT="$PWD/out-homes" XTRA="-DDSTEST -DDS_ACT_HOMES -DDS_ACT_HOMES_LIMIT=8" bash tools/dsbuild/mkp.sh
          DSRUN=/tmp/dsrun bash ports/dsi/test/ds_homes_smoke.sh "$PWD/out-homes"
      - name: Audit generated DS homes, stairs, access and room geometry
        timeout-minutes: 8
        run: DSRUN=/tmp/dsrun bash ports/dsi/test/ds_town7_audit.sh
      - name: Emulate skate plaza geometry, riding, FPS and polygon budget
        timeout-minutes: 8
        run: DSRUN=/tmp/dsrun bash ports/dsi/test/ds_skate_smoke.sh "$PWD/out-skate"
      - name: Emulate reverse-stick braking and rail direction in all four directions
        timeout-minutes: 8
        run: DSRUN=/tmp/dsrun bash ports/dsi/test/ds_skate_controls_smoke.sh "$PWD/out-skate-controls"
      - name: Decode native cached character packets and verify exact geometry costs
        timeout-minutes: 8
        run: DSRUN=/tmp/dsrun bash ports/dsi/test/ds_sim_cache_smoke.sh "$PWD/out-sim-cache"
      - name: Upload DS character-cache regression evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bore2_ds_sim_cache
          path: |
            out-sim-cache/sim_cache_results.json
            out-sim-cache/ram_*.bin
            out-sim-cache/cache.ppm
            out-sim-cache/emulate.log
            out-sim-cache/build*.log
          if-no-files-found: warn
      - name: Upload DS controller regression evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bore2_ds_skate_controls
          path: |
            out-skate-controls/controls_results.json
            out-skate-controls/controls.log
            out-skate-controls/controls.ppm
            out-skate-controls/build.log
          if-no-files-found: warn
      - name: Upload DS skate regression evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bore2_ds_skate_visual
          path: |
            out-skate/skate_*.ppm
            out-skate/skate_results.json
            out-skate/skate.log
            out-skate/build.log
          if-no-files-found: warn
      - name: Capture generated-house roof and cutaway atlas at native DS resolution
        timeout-minutes: 10
        run: DSRUN=/tmp/dsrun bash ports/dsi/test/ds_visual_atlas.sh "$PWD/out-visual"
      - name: Verify upstairs stairwell roofs with native camera rotations
        timeout-minutes: 10
        run: DSRUN=/tmp/dsrun bash ports/dsi/test/ds_roof_stair_smoke.sh "$PWD/out-roof-stairs"
      - name: Upload native stairwell roof regression evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bore2_ds_stairwell_roof
          path: |
            out-roof-stairs/*.ppm
            out-roof-stairs/roof_stair_results.json
            out-roof-stairs/build-*.log
            out-roof-stairs/emulate-*.log
          if-no-files-found: warn
      - name: Upload native DS visual atlas
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bore2_ds_visual_atlas
          path: |
            out-visual/*.ppm
            out-visual/visual_atlas_results.json
            out-visual/build-*.log
            out-visual/emulate-*.log
          if-no-files-found: warn
      - name: Upload DS gameplay screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bore2_ds_gameplay_smoke
          path: |
            out/flow.ppm
            out-island/island.ppm
            out-homes/homes.ppm
            out/title_one_tap.ppm
            out/title_two_taps.ppm
          if-no-files-found: ignore
      - name: Name it
        run: mkdir -p rom && cp out/bore.nds rom/bore2_dsi_${GITHUB_SHA::7}.nds && ls -la rom
      - uses: actions/upload-artifact@v4
        with: { name: bore2_dsi_rom, path: "rom/*.nds" }
