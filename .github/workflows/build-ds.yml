name: build-ds
# One DS/DSi ROM per run: bore2_dsi.nds. Run it by hand (Actions > build-ds > Run workflow) or it runs on every push
# that touches the DS port or the shared game files.
on:
  workflow_dispatch:
  push:
    paths: ["ports/dsi/**", "tools/dsbuild/**", "tools/dsemu/**", "src/bigmap.*", "src/lot_footprints.h", "src/parcel_plan.h", "src/world_surface.h", "src/landscape.h", "src/vehicle_stability.h", "test/vehicle_stability_test.c", "src/trail_plan.h", "test/trail_test.c", "test/trail_world_test.c", "test/landscape_test.c", "src/park_plan.h", "src/neighborhood_life.h", "test/neighborhood_life_test.c", "src/native_life.h", "test/native_life_test.c", "src/common.h", "src/frame_render_policy.h", "test/frame_render_policy_test.c", "src/roof_profile.h", "test/roof_profile_test.c", "assets/dsmusic.bin", "assets/SONGS.BIN", "assets/songs.inc", "src/band_roles.inc", "src/scene_music.h", "src/living_calendar.h", "test/living_calendar_test.c", "src/outings.h", "src/outing_links.h", "test/outing_links_test.c", "src/world_access.h", "test/world_access_test.c", "test/outings_test.c", "src/audio_slice.h", "test/audio_slice_test.c", "test/scene_music_test.c", "tools/neighborhood_music.py", "tools/living_score.py", "test/living_score_test.py", "tools/content_spu.c", "tools/dsmusic/**", "src/social_activity.h", "test/social_activity_test.c", ".github/workflows/build-ds.yml"]
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
jobs:
  rom:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Verify vehicle footprints and non-wrapping traffic rebases
        run: cc -O2 -std=c99 -Wall -Wextra -Werror -Isrc test/vehicle_stability_test.c -o /tmp/vehicle_stability && /tmp/vehicle_stability
      - name: Verify connected trail masks and generated world boundaries
        run: |
          cc -O2 -std=c99 -Wall -Wextra -Werror -Isrc test/trail_test.c -o /tmp/trail_test && /tmp/trail_test
          cc -O2 -std=gnu11 -Iports/host/shim -Isrc test/trail_world_test.c src/bigmap.c -o /tmp/trail_world_test && /tmp/trail_world_test
      - name: Verify continuous terrain, flat lot pads and sculpt falloff
        run: cc -O2 -std=c99 -Wall -Wextra -Werror -Isrc test/landscape_test.c -o /tmp/landscape_test && /tmp/landscape_test
      - name: Verify terrain editor capacity, edge coordinates and undo
        run: cc -O2 -std=gnu11 -Iports/host/shim -Isrc test/terrain_editor_test.c src/bigmap.c -o /tmp/terrain_editor_test && /tmp/terrain_editor_test
      - name: Verify contextual resident dialogue and bounded activity poses
        run: cc -std=c99 -Wall -Wextra -Werror -DARM9 -Isrc test/native_life_test.c -o /tmp/native_life && /tmp/native_life
      - name: Verify classic music rotation and hidden archive indexing
        run: cc -std=c99 -Wall -Wextra -Werror -Isrc test/music_library_test.c -o /tmp/music_library && /tmp/music_library
      - name: Verify frame ownership and safe cache replacement
        run: cc -std=c99 -Wall -Wextra -Werror -Isrc test/frame_render_policy_test.c -o /tmp/frame_policy && /tmp/frame_policy
      - name: Test DS neighborhood viewport (host C99)
        run: cc -std=c99 -Wall -Wextra -Werror ports/dsi/test/ds_mapview_test.c -o /tmp/ds_mapview_test && /tmp/ds_mapview_test
      - name: Test exact traffic broadphase and conservative camera culling
        run: cc -std=c99 -Wall -Wextra -Werror -Wno-misleading-indentation ports/dsi/test/ds_city_budget_test.c -lm -o /tmp/ds_city_budget_test && /tmp/ds_city_budget_test
      - name: Test planned DS building shells against playable lot dimensions
        run: cc -std=c99 -Wall -Wextra -Werror -Iports/host/shim -Isrc -Iports/dsi/source ports/dsi/test/ds_lot_shell_test.c -o /tmp/ds_lot_shell && /tmp/ds_lot_shell
      - name: Test shared landscape plans and local resident preferences
        run: cc -std=c99 -Wall -Wextra -Werror -Iports/host/shim -Isrc test/neighborhood_life_test.c -o /tmp/neighborhood_life && /tmp/neighborhood_life
      - name: Test shared capped roof profiles
        run: cc -std=c99 -Wall -Wextra -Werror -Isrc test/roof_profile_test.c -o /tmp/roof_profile && /tmp/roof_profile
      - name: Test DS floor and roof geometry
        run: cc -std=c99 -Wall -Wextra -Werror ports/dsi/test/ds_render_geom_test.c -o /tmp/ds_render_geom_test && /tmp/ds_render_geom_test
      - name: Test handheld and console aspiration regressions
        run: python3 test/wants_regression.py
      - name: Verify bounded audio transfers and stop acknowledgements
        run: cc -std=c99 -Wall -Wextra -Werror test/audio_slice_test.c -o /tmp/audio_slice_test && /tmp/audio_slice_test
      - name: Verify physical venue and transport access policy
        run: cc -std=c99 -Wall -Wextra -Werror -Iports/host/shim -Isrc test/world_access_test.c -o /tmp/world_access_test && /tmp/world_access_test
      - name: Verify local venue consequences and same-block contact selection
        run: cc -std=c99 -Wall -Wextra -Werror test/outing_links_test.c -o /tmp/outing_links_test && /tmp/outing_links_test
      - name: Verify 54 distinct contextual arrangements and exact source notes
        run: python3 test/living_score_test.py
      - name: Verify living calendar and older music bank fallback
        run: cc -std=c99 -Wall -Wextra -Werror test/living_calendar_test.c -o /tmp/living_calendar_test && /tmp/living_calendar_test
      - name: Verify all 48 local activities and completion gates
        run: cc -std=c99 -Wall -Wextra -Werror -Iports/host/shim -Isrc test/outings_test.c -o /tmp/outings_test && /tmp/outings_test
      - name: Verify contextual music routing and transition stability
        run: cc -std=c99 -Wall -Wextra -Werror -Iports/host/shim -Isrc test/scene_music_test.c -o /tmp/scene_music_test && /tmp/scene_music_test
      - name: Verify shared social activity costs and eligibility
        run: cc -std=c99 -Wall -Wextra -Werror test/social_activity_test.c -o /tmp/social_activity_test && /tmp/social_activity_test
      - name: Verify DS persistent contacts and collision handling
        run: cc -std=c99 -Wall -Wextra -Werror ports/dsi/test/ds_contacts_test.c -o /tmp/ds_contacts_test && /tmp/ds_contacts_test
      - name: Verify stable resident routines and streaming fringe
        run: cc -std=c99 -Wall -Wextra -Werror ports/dsi/test/ds_cit_routine_test.c -o /tmp/ds_cit_routine_test && /tmp/ds_cit_routine_test
      - name: Test DS safe deletion confirmation
        run: cc -std=c99 -Wall -Wextra -Werror ports/dsi/test/ds_confirm_test.c -o /tmp/ds_confirm_test && /tmp/ds_confirm_test
      - name: Test DS furniture reachability and boundary walls
        run: cc -std=c99 -Wall -Wextra -Werror ports/dsi/test/ds_action_spots_test.c -o /tmp/ds_action_spots_test && /tmp/ds_action_spots_test
      - name: Tools (clang, lld, python)
        run: sudo apt-get update && sudo apt-get install -y clang-18 lld-18 llvm-18 python3 xz-utils && sudo ln -sf /usr/bin/ld.lld-18 /usr/local/bin/ld.lld && sudo ln -sf /usr/bin/llvm-objcopy-18 /usr/local/bin/llvm-objcopy && sudo ln -sf /usr/bin/clang-18 /usr/local/bin/clang
      - name: Get the saved DS toolchain (branch ds-toolchain)
        run: tools/dsbuild/restore.sh
      - name: Build the ROM
        run: OUT=$PWD/out tools/dsbuild/mkp.sh
      - name: Emulate purchase, save/load and job gameplay
        timeout-minutes: 8
        run: |
          test -x /tmp/dsrun
          test -f out/bore.elf
          sudo ln -sf /usr/bin/llvm-nm-18 /usr/local/bin/llvm-nm
          DSRUN=/tmp/dsrun bash ports/dsi/test/ds_flow.sh "$PWD/out"
      - name: Emulate safe title-screen save deletion
        timeout-minutes: 6
        run: DSRUN=/tmp/dsrun bash ports/dsi/test/ds_delete_smoke.sh "$PWD/out"
      - name: Emulate stairs and island interaction suite
        timeout-minutes: 8
        run: |
          OUT="$PWD/out-island" XTRA="-DDSTEST -DDS_ISL_TEST" bash tools/dsbuild/mkp.sh
          DSRUN=/tmp/dsrun bash ports/dsi/test/ds_island_smoke.sh "$PWD/out-island"
      - name: Emulate furnished-home interaction routes
        timeout-minutes: 8
        run: |
          OUT="$PWD/out-homes" XTRA="-DDSTEST -DDS_ACT_HOMES -DDS_ACT_HOMES_LIMIT=8" bash tools/dsbuild/mkp.sh
          DSRUN=/tmp/dsrun bash ports/dsi/test/ds_homes_smoke.sh "$PWD/out-homes"
      - name: Audit generated DS homes, stairs, access and room geometry
        timeout-minutes: 8
        run: DSRUN=/tmp/dsrun bash ports/dsi/test/ds_town7_audit.sh
      - name: Emulate skate plaza geometry, riding, FPS and polygon budget
        timeout-minutes: 8
        run: DSRUN=/tmp/dsrun bash ports/dsi/test/ds_skate_smoke.sh "$PWD/out-skate"
      - name: Emulate reverse-stick braking and rail direction in all four directions
        timeout-minutes: 8
        run: DSRUN=/tmp/dsrun bash ports/dsi/test/ds_skate_controls_smoke.sh "$PWD/out-skate-controls"
      - name: Decode native cached character packets and verify exact geometry costs
        timeout-minutes: 8
        run: DSRUN=/tmp/dsrun bash ports/dsi/test/ds_sim_cache_smoke.sh "$PWD/out-sim-cache"
      - name: Upload DS character-cache regression evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bore2_ds_sim_cache
          path: |
            out-sim-cache/sim_cache_results.json
            out-sim-cache/ram_*.bin
            out-sim-cache/cache.ppm
            out-sim-cache/emulate.log
            out-sim-cache/build*.log
          if-no-files-found: warn
      - name: Upload DS controller regression evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bore2_ds_skate_controls
          path: |
            out-skate-controls/controls_results.json
            out-skate-controls/controls.log
            out-skate-controls/controls.ppm
            out-skate-controls/build.log
          if-no-files-found: warn
      - name: Upload DS skate regression evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bore2_ds_skate_visual
          path: |
            out-skate/skate_*.ppm
            out-skate/skate_results.json
            out-skate/skate.log
            out-skate/build.log
          if-no-files-found: warn
      - name: Capture generated-house roof and cutaway atlas at native DS resolution
        timeout-minutes: 10
        run: DSRUN=/tmp/dsrun bash ports/dsi/test/ds_visual_atlas.sh "$PWD/out-visual"
      - name: Verify upstairs stairwell roofs with native camera rotations
        timeout-minutes: 10
        run: DSRUN=/tmp/dsrun bash ports/dsi/test/ds_roof_stair_smoke.sh "$PWD/out-roof-stairs"
      - name: Upload native stairwell roof regression evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bore2_ds_stairwell_roof
          path: |
            out-roof-stairs/*.ppm
            out-roof-stairs/roof_stair_results.json
            out-roof-stairs/build-*.log
            out-roof-stairs/emulate-*.log
          if-no-files-found: warn
      - name: Upload native DS visual atlas
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bore2_ds_visual_atlas
          path: |
            out-visual/*.ppm
            out-visual/visual_atlas_results.json
            out-visual/build-*.log
            out-visual/emulate-*.log
          if-no-files-found: warn
      - name: Upload DS gameplay screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bore2_ds_gameplay_smoke
          path: |
            out/flow.ppm
            out-island/island.ppm
            out-homes/homes.ppm
            out/title_one_tap.ppm
            out/title_two_taps.ppm
          if-no-files-found: ignore
      - name: Name it
        run: mkdir -p rom && cp out/bore.nds rom/bore2_dsi_${GITHUB_SHA::7}.nds && ls -la rom
      - uses: actions/upload-artifact@v4
        with: { name: bore2_dsi_rom, path: "rom/*.nds" }
