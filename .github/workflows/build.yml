name: build
on: [push, workflow_dispatch]
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
jobs:
  world-coherence:
    name: Generated-world map/lot coherence
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Verify mutually exclusive terrain cache ownership
        run: cc -O2 -std=c99 -Wall -Wextra -Werror -Isrc test/terrain_render_cache_test.c -o /tmp/terrain_render_cache && /tmp/terrain_render_cache
      - name: Verify vehicle footprints and non-wrapping traffic rebases
        run: cc -O2 -std=c99 -Wall -Wextra -Werror -Isrc test/vehicle_stability_test.c -o /tmp/vehicle_stability && /tmp/vehicle_stability
      - name: Verify real traffic parking across world-window rebases
        run: make -C ports/host/traffic trafsim && ports/host/traffic/trafsim --parking-test
      - name: Verify shared river, causeway and courtyard surfaces
        run: cc -O2 -std=c99 -Wall -Wextra -Werror -Iports/host/shim -Isrc test/world_surface_test.c -o /tmp/world_surface && /tmp/world_surface
      - name: Verify regional road continuity, usable farm frontage and actual lot access
        run: cc -O2 -std=gnu11 -Iports/host/shim -Isrc test/world_frontage_test.c src/bigmap.c -o /tmp/world_frontage && /tmp/world_frontage
      - name: Verify connected trail masks and generated world boundaries
        run: |
          cc -O2 -std=c99 -Wall -Wextra -Werror -Isrc test/trail_test.c -o /tmp/trail_test && /tmp/trail_test
          cc -O2 -std=gnu11 -Iports/host/shim -Isrc test/trail_world_test.c src/bigmap.c -o /tmp/trail_world_test && /tmp/trail_world_test
      - name: Verify continuous terrain, flat lot pads and sculpt falloff
        run: cc -O2 -std=c99 -Wall -Wextra -Werror -Isrc test/landscape_test.c -o /tmp/landscape_test && /tmp/landscape_test
      - name: Verify terrain editor capacity, edge coordinates and undo
        run: cc -O2 -std=gnu11 -Iports/host/shim -Isrc test/terrain_editor_test.c src/bigmap.c -o /tmp/terrain_editor_test && /tmp/terrain_editor_test
      - name: Verify contextual resident dialogue and bounded activity poses
        run: cc -std=c99 -Wall -Wextra -Werror -Isrc test/native_life_test.c -o /tmp/native_life && /tmp/native_life
      - name: Verify classic music rotation and hidden archive indexing
        run: cc -std=c99 -Wall -Wextra -Werror -Isrc test/music_library_test.c -o /tmp/music_library && /tmp/music_library
      - name: Verify frame ownership and safe cache replacement
        run: cc -std=c99 -Wall -Wextra -Werror -Isrc test/frame_render_policy_test.c -o /tmp/frame_policy && /tmp/frame_policy
      - name: Check that the audit cannot silently pass on bad output
        run: python3 -m unittest discover -s test -p 'test_world_coherence.py' -v
      - name: Verify PS1 lens/dolly parallax and unchanged first-person and Dreamcast views
        run: |
          cc -std=c99 -Wall -Wextra -Werror test/camera_lens_test.c -o /tmp/camera_lens_ps1
          /tmp/camera_lens_ps1
          cc -std=c99 -Wall -Wextra -Werror -DBORE_DC test/camera_lens_test.c -o /tmp/camera_lens_dc
          /tmp/camera_lens_dc
      - name: Verify whole-house LOD hysteresis and moving camera stability
        run: cc -std=c99 -Wall -Wextra -Werror test/house_lod_test.c -o /tmp/house_lod && /tmp/house_lod
      - name: Verify shared landscape plans and local resident preferences
        run: cc -std=c99 -Wall -Wextra -Werror -Iports/host/shim -Isrc test/neighborhood_life_test.c -o /tmp/neighborhood_life && /tmp/neighborhood_life
      - name: Verify shared capped roof profiles
        run: cc -std=c99 -Wall -Wextra -Werror -Isrc test/roof_profile_test.c -o /tmp/roof_profile && /tmp/roof_profile
      - name: Verify compact L-house skyline geometry cache
        run: cc -std=c99 -Wall -Wextra -Werror -Isrc test/house_shape_test.c -o /tmp/house_shape && /tmp/house_shape
      - name: Verify near/far house footprint edges match generated inclusive walls
        run: cc -std=c99 -Wall -Wextra -Werror test/house_footprint_test.c -o /tmp/house_footprint && /tmp/house_footprint
      - name: Verify pending-house proxy and prioritized roof handoff
        run: cc -std=c99 -Wall -Wextra -Werror test/world_stream_models_test.c -o /tmp/world_stream_models && /tmp/world_stream_models
      - name: Verify bounded audio transfers and stop acknowledgements
        run: cc -std=c99 -Wall -Wextra -Werror test/audio_slice_test.c -o /tmp/audio_slice_test && /tmp/audio_slice_test
      - name: Verify physical venue and transport access policy
        run: cc -std=c99 -Wall -Wextra -Werror -Iports/host/shim -Isrc test/world_access_test.c -o /tmp/world_access_test && /tmp/world_access_test
      - name: Verify local venue consequences and same-block contact selection
        run: cc -std=c99 -Wall -Wextra -Werror test/outing_links_test.c -o /tmp/outing_links_test && /tmp/outing_links_test
      - name: Verify 54 distinct contextual arrangements and exact source notes
        run: python3 test/living_score_test.py
      - name: Verify living calendar and older music bank fallback
        run: cc -std=c99 -Wall -Wextra -Werror test/living_calendar_test.c -o /tmp/living_calendar_test && /tmp/living_calendar_test
      - name: Verify all 48 local activities and completion gates
        run: cc -std=c99 -Wall -Wextra -Werror -Iports/host/shim -Isrc test/outings_test.c -o /tmp/outings_test && /tmp/outings_test
      - name: Verify contextual music routing and transition stability
        run: cc -std=c99 -Wall -Wextra -Werror -Iports/host/shim -Isrc test/scene_music_test.c -o /tmp/scene_music_test && /tmp/scene_music_test
      - name: Build and audit 10 MiB-plus new calendar score on each format
        run: python3 tools/neighborhood_music.py both assets /tmp/bore-content
      - uses: actions/upload-artifact@v4
        with:
          name: neighborhood-content-manifest
          path: /tmp/bore-content/manifest-both.json
      - name: Verify shared social activity costs and eligibility
        run: cc -std=c99 -Wall -Wextra -Werror test/social_activity_test.c -o /tmp/social_activity_test && /tmp/social_activity_test
      - name: Verify everyday goals and aspiration rewards
        run: python3 test/wants_regression.py
      - name: Verify speed-bounded skate chase camera focus
        run: |
          cc -std=c99 -Wall -Wextra -Werror test/skate_camera_test.c -o /tmp/skate_camera_test
          /tmp/skate_camera_test
      - name: Verify actual PS1 and Dreamcast skate braking and rail direction
        run: bash test/skate_controls_regression.sh
      - name: Verify real near/far projections and cached sprites share the camera lens
        run: bash test/projection_regression.sh
      - name: Compare real lot walls, doors, drives and map/far footprints
        run: python3 test/world_coherence.py --json-out world_coherence_results.json
      - name: Keep seed-by-seed evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: world-coherence-audit
          path: world_coherence_results.json
          if-no-files-found: warn
  disc:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Install the PS1 compiler and PSn00bSDK
        run: |
          sudo apt-get update && sudo apt-get install -y cmake ninja-build unzip
          B=https://github.com/Lameguy64/PSn00bSDK/releases/download/v0.24
          curl -fsSL $B/gcc-mipsel-none-elf-12.3.0-Linux.zip -o gcc.zip
          curl -fsSL $B/PSn00bSDK-0.24-Linux.zip -o sdk.zip
          sudo mkdir -p /opt/mipsel && sudo unzip -q gcc.zip -d /opt/mipsel
          sudo unzip -q sdk.zip -d /opt && sudo mv /opt/PSn00bSDK-0.24-Linux /opt/psn00bsdk
          sudo chmod -R a+rx /opt/mipsel /opt/psn00bsdk
      - name: Build the disc
        run: |
          export PATH=/opt/mipsel/bin:/opt/psn00bsdk/bin:$PATH PSN00BSDK_LIBS=/opt/psn00bsdk/lib/libpsn00b
          cmake --preset default && cmake --build build --target chd base_chd packs
      - name: Memory report (what the game's RAM goes on)
        continue-on-error: true
        run: |
          export PATH=/opt/mipsel/bin:$PATH
          { echo "== sections =="; mipsel-none-elf-size -A build/bore2.elf
            echo; echo "== biggest 70 symbols (bytes, type, name) =="
            mipsel-none-elf-nm -S --size-sort -r build/bore2.elf | head -70 | python3 -c "import sys; [print(int(l.split()[1],16), l.split()[2], l.split()[3]) for l in sys.stdin if len(l.split())>=4]"
            echo; echo "== biggest 25 map entries (bytes, section, file) =="
            python3 -c "
          import re
          r=[]
          for l in open('build/bore2.map'):
              m=re.match(r'^ (\.[A-Za-z0-9_.]+)\s+0x[0-9a-f]+\s+(0x[0-9a-f]+)\s+(\S+)', l)
              if m and int(m.group(2),16)>0: r.append((int(m.group(2),16), m.group(1), m.group(3)))
          [print(*x) for x in sorted(r, reverse=True)[:25]]"
          } | tee build/memreport.txt
      - uses: actions/upload-artifact@v4
        with: { name: memreport, path: "build/memreport.txt" }
      - name: Name the files for release
        run: |
          mkdir -p out/packs
          cp build/BORE2-base.chd out/BORE2-base.chd
          cp build/BORE2.chd out/BORE2-full.chd
          for f in build/packs/*.ppf; do cp "$f" out/packs/; done
          ls -l out out/packs
      - uses: actions/upload-artifact@v4
        with: { name: bore2_disc, path: "build/bore2.*" }
      - name: Upload the base disc (no packs)
        uses: actions/upload-artifact@v4
        with: { name: BORE2-base, path: "out/BORE2-base.chd", if-no-files-found: error }
      - name: Upload the full disc (every pack)
        uses: actions/upload-artifact@v4
        with: { name: BORE2-full, path: "out/BORE2-full.chd", if-no-files-found: error }
      - name: Upload pack KINGDOM
        uses: actions/upload-artifact@v4
        with: { name: "BORE2-pack-KINGDOM", path: "out/packs/BORE2-KINGDOM.ppf", if-no-files-found: error }
      - name: Upload pack ARCADE
        uses: actions/upload-artifact@v4
        with: { name: "BORE2-pack-ARCADE", path: "out/packs/BORE2-ARCADE.ppf", if-no-files-found: error }
      - name: Upload pack GOTCHI
        uses: actions/upload-artifact@v4
        with: { name: "BORE2-pack-GOTCHI", path: "out/packs/BORE2-GOTCHI.ppf", if-no-files-found: error }
      - name: Upload pack SUPER
        uses: actions/upload-artifact@v4
        with: { name: "BORE2-pack-SUPER", path: "out/packs/BORE2-SUPER.ppf", if-no-files-found: error }
      - name: Upload pack PRISON
        uses: actions/upload-artifact@v4
        with: { name: "BORE2-pack-PRISON", path: "out/packs/BORE2-PRISON.ppf", if-no-files-found: error }
      - name: Upload pack PARTY
        uses: actions/upload-artifact@v4
        with: { name: "BORE2-pack-PARTY", path: "out/packs/BORE2-PARTY.ppf", if-no-files-found: error }
      - name: Upload pack SPACE
        uses: actions/upload-artifact@v4
        with: { name: "BORE2-pack-SPACE", path: "out/packs/BORE2-SPACE.ppf", if-no-files-found: error }
      - name: Upload pack DOG
        uses: actions/upload-artifact@v4
        with: { name: "BORE2-pack-DOG", path: "out/packs/BORE2-DOG.ppf", if-no-files-found: error }
      - name: Upload pack DJ
        uses: actions/upload-artifact@v4
        with: { name: "BORE2-pack-DJ", path: "out/packs/BORE2-DJ.ppf", if-no-files-found: error }
      - name: Upload pack PARADISE
        uses: actions/upload-artifact@v4
        with: { name: "BORE2-pack-PARADISE", path: "out/packs/BORE2-PARADISE.ppf", if-no-files-found: error }
      - name: Upload pack FARM
        uses: actions/upload-artifact@v4
        with: { name: "BORE2-pack-FARM", path: "out/packs/BORE2-FARM.ppf", if-no-files-found: error }
      - name: Upload pack SKYSEA
        uses: actions/upload-artifact@v4
        with: { name: "BORE2-pack-SKYSEA", path: "out/packs/BORE2-SKYSEA.ppf", if-no-files-found: error }
      - uses: actions/upload-artifact@v4
        with:
          name: BORE2_release
          path: |
            out/BORE2-base.chd
            out/BORE2-full.chd
            out/packs/*.ppf
