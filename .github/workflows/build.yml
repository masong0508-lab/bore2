name: build
on: [push, workflow_dispatch]
jobs:
  disc:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Install the PS1 compiler and PSn00bSDK
        run: |
          sudo apt-get update && sudo apt-get install -y cmake ninja-build unzip
          B=https://github.com/Lameguy64/PSn00bSDK/releases/download/v0.24
          curl -fsSL $B/gcc-mipsel-none-elf-12.3.0-Linux.zip -o gcc.zip
          curl -fsSL $B/PSn00bSDK-0.24-Linux.zip -o sdk.zip
          sudo mkdir -p /opt/mipsel && sudo unzip -q gcc.zip -d /opt/mipsel
          sudo unzip -q sdk.zip -d /opt && sudo mv /opt/PSn00bSDK-0.24-Linux /opt/psn00bsdk
          sudo chmod -R a+rx /opt/mipsel /opt/psn00bsdk
      - name: Build the disc
        run: |
          export PATH=/opt/mipsel/bin:/opt/psn00bsdk/bin:$PATH PSN00BSDK_LIBS=/opt/psn00bsdk/lib/libpsn00b
          cmake --preset default && cmake --build build --target chd base_chd packs
      - name: Memory report (what the game's RAM goes on)
        continue-on-error: true
        run: |
          export PATH=/opt/mipsel/bin:$PATH
          { echo "== sections =="; mipsel-none-elf-size -A build/bore2.elf
            echo; echo "== biggest 70 symbols (bytes, type, name) =="
            mipsel-none-elf-nm -S --size-sort -r build/bore2.elf | head -70 | python3 -c "import sys; [print(int(l.split()[1],16), l.split()[2], l.split()[3]) for l in sys.stdin if len(l.split())>=4]"
            echo; echo "== biggest 25 map entries (bytes, section, file) =="
            python3 -c "
          import re
          r=[]
          for l in open('build/bore2.map'):
              m=re.match(r'^ (\.[A-Za-z0-9_.]+)\s+0x[0-9a-f]+\s+(0x[0-9a-f]+)\s+(\S+)', l)
              if m and int(m.group(2),16)>0: r.append((int(m.group(2),16), m.group(1), m.group(3)))
          [print(*x) for x in sorted(r, reverse=True)[:25]]"
          } | tee build/memreport.txt
      - uses: actions/upload-artifact@v4
        with: { name: memreport, path: "build/memreport.txt" }
      - name: Name the files for release
        run: |
          mkdir -p out/packs
          cp build/BORE2-base.chd out/BORE2-base.chd
          cp build/BORE2.chd out/BORE2-full.chd
          for f in build/packs/*.ppf; do cp "$f" out/packs/; done
          ls -l out out/packs
      - uses: actions/upload-artifact@v4
        with: { name: bore2_disc, path: "build/bore2.*" }
      - name: Upload the base disc (no packs)
        uses: actions/upload-artifact@v4
        with: { name: BORE2-base, path: "out/BORE2-base.chd", if-no-files-found: error }
      - name: Upload the full disc (every pack)
        uses: actions/upload-artifact@v4
        with: { name: BORE2-full, path: "out/BORE2-full.chd", if-no-files-found: error }
      - name: Upload pack KINGDOM
        uses: actions/upload-artifact@v4
        with: { name: "BORE2-pack-KINGDOM", path: "out/packs/BORE2-KINGDOM.ppf", if-no-files-found: error }
      - name: Upload pack ARCADE
        uses: actions/upload-artifact@v4
        with: { name: "BORE2-pack-ARCADE", path: "out/packs/BORE2-ARCADE.ppf", if-no-files-found: error }
      - name: Upload pack GOTCHI
        uses: actions/upload-artifact@v4
        with: { name: "BORE2-pack-GOTCHI", path: "out/packs/BORE2-GOTCHI.ppf", if-no-files-found: error }
      - name: Upload pack SUPER
        uses: actions/upload-artifact@v4
        with: { name: "BORE2-pack-SUPER", path: "out/packs/BORE2-SUPER.ppf", if-no-files-found: error }
      - name: Upload pack PRISON
        uses: actions/upload-artifact@v4
        with: { name: "BORE2-pack-PRISON", path: "out/packs/BORE2-PRISON.ppf", if-no-files-found: error }
      - name: Upload pack PARTY
        uses: actions/upload-artifact@v4
        with: { name: "BORE2-pack-PARTY", path: "out/packs/BORE2-PARTY.ppf", if-no-files-found: error }
      - name: Upload pack SPACE
        uses: actions/upload-artifact@v4
        with: { name: "BORE2-pack-SPACE", path: "out/packs/BORE2-SPACE.ppf", if-no-files-found: error }
      - name: Upload pack DOG
        uses: actions/upload-artifact@v4
        with: { name: "BORE2-pack-DOG", path: "out/packs/BORE2-DOG.ppf", if-no-files-found: error }
      - name: Upload pack DJ
        uses: actions/upload-artifact@v4
        with: { name: "BORE2-pack-DJ", path: "out/packs/BORE2-DJ.ppf", if-no-files-found: error }
      - name: Upload pack PARADISE
        uses: actions/upload-artifact@v4
        with: { name: "BORE2-pack-PARADISE", path: "out/packs/BORE2-PARADISE.ppf", if-no-files-found: error }
      - name: Upload pack FARM
        uses: actions/upload-artifact@v4
        with: { name: "BORE2-pack-FARM", path: "out/packs/BORE2-FARM.ppf", if-no-files-found: error }
      - name: Upload pack SKYSEA
        uses: actions/upload-artifact@v4
        with: { name: "BORE2-pack-SKYSEA", path: "out/packs/BORE2-SKYSEA.ppf", if-no-files-found: error }
      - uses: actions/upload-artifact@v4
        with:
          name: BORE2_release
          path: |
            out/BORE2-base.chd
            out/BORE2-full.chd
            out/packs/*.ppf
